name: TEMP Drill Release

# 临时演练工作流：用 v0.1.8 已发布 APK 复制出 beta / 灰度 Release，验证客户端
# Beta 通道与灰度分桶。演练后删除本文件与对应 Release。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "beta | drill"
        required: true
        type: choice
        options: [beta, drill]

permissions:
  contents: write

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create drill release
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p dl dist
          gh release download v0.1.8 --pattern '*-release-signed.apk' --pattern '*.apk.sha256' --dir dl
          APK="$(ls dl/*-release-signed.apk | head -1)"
          echo "source APK: $APK"

          if [ "$MODE" = "beta" ]; then
            TAG="v0.1.9-beta.1"
            OUT="dist/zhibox-0.1.9-beta.1-0000000-release-signed.apk"
            gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
            gh release create "$TAG" --prerelease --target master \
              --title "TEMP v0.1.9-beta.1 (Beta drill)" \
              --notes "临时 Beta 演练版本（APK 复用 v0.1.8，仅验证 Beta 通道可见性），演练后删除。"
          else
            TAG="v0.1.9-drill"
            OUT="dist/zhibox-0.1.9-drill-0000000-release-signed.apk"
            gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
            gh release create "$TAG" --target master \
              --title "TEMP v0.1.9-drill (rollout drill)" \
              --notes "临时灰度演练版本（APK 复用 v0.1.8，仅验证 rollout 分桶），演练后删除。"
          fi

          cp -f "$APK" "$OUT"
          sha256sum "$OUT" | sed 's|dist/||' > "$OUT.sha256"

          if [ "$MODE" = "drill" ]; then
            python3 - <<'PY' > dist/zhibox-0.1.9-drill-0000000-update.json
          import json, os, hashlib
          apk = "dist/zhibox-0.1.9-drill-0000000-release-signed.apk"
          payload = {
              "schema": 1,
              "versionName": "0.1.9-drill",
              "tagName": "v0.1.9-drill",
              "channel": "stable",
              "rolloutPercent": 0,
              "minSupportedVersion": "0.1.0",
              "publishedAt": "2026-10-28T00:00:00Z",
              "htmlUrl": "https://github.com/IAmKings/ZhiBox/releases/tag/v0.1.9-drill",
              "apk": {
                  "name": os.path.basename(apk),
                  "size": os.path.getsize(apk),
                  "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              },
          }
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
          fi

          ls -l dist
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json assets
