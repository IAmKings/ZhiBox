name: TEMP Forced Drill

# 临时演练：构建 debug 0.1.12-beta.1（versionCode 13）并发布为 prerelease，
# update.json 强制 minSupportedVersion=0.1.12；用于验证强制更新与通知被拒自动安装。
# 演练后删除本文件与 Release。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forced:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug 0.1.12-beta.1
        run: |
          set -euo pipefail
          TAG="v0.1.12-beta.1"
          sed -i 's/versionCode = 12/versionCode = 13/; s/versionName = "0.1.11-beta.1"/versionName = "0.1.12-beta.1"/' app/build.gradle.kts
          grep -nE 'versionCode|versionName' app/build.gradle.kts | head -2
          ./gradlew :app:assembleDebug
          mkdir -p dist
          OUT="dist/zhibox-0.1.12-beta.1-0000000-release-signed.apk"
          cp -f app/build/outputs/apk/debug/app-debug.apk "$OUT"
          sha256sum "$OUT" | sed 's|dist/||' > "$OUT.sha256"
          python3 - <<'PY' > dist/zhibox-0.1.12-beta.1-0000000-update.json
          import json, os, hashlib
          apk = "dist/zhibox-0.1.12-beta.1-0000000-release-signed.apk"
          payload = {
              "schema": 1,
              "versionName": "0.1.12-beta.1",
              "tagName": "v0.1.12-beta.1",
              "channel": "beta",
              "rolloutPercent": 100,
              "minSupportedVersion": "0.1.12",
              "publishedAt": "2026-10-28T01:00:00Z",
              "htmlUrl": "https://github.com/IAmKings/ZhiBox/releases/tag/v0.1.12-beta.1",
              "apk": {
                  "name": os.path.basename(apk),
                  "size": os.path.getsize(apk),
                  "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              },
          }
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
          ls -l dist
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v0.1.12-beta.1 --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create v0.1.12-beta.1 --prerelease --target master \
            --title "TEMP v0.1.12-beta.1 (forced drill)" \
            --notes "临时演练版本（debug 签名，0.1.12-beta.1，minSupported=0.1.12），演练后删除。"
          gh release upload v0.1.12-beta.1 dist/* --clobber
          gh release view v0.1.12-beta.1 --json assets
