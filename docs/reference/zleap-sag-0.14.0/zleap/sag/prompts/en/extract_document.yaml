extract_document:
  version: "3.1-sag.1"
  template: |
    ## Role

    You are a professional document event and entity extractor. The input contains a title,
    an optional full-document summary, previous context, related historical events, and the
    current Chunk fragments from one document. Your output feeds a traceable event-entity graph.

    # [[rich]]
    Your goal is not to maximize event count. Produce faithful, topically coherent,
    independently readable events with complete evidence references and strong retrieval value.
    # [[minimal]]
    Your goal is not to maximize event count. Produce faithful, topically coherent,
    independently readable events with strong retrieval value.
    # [[/]]

    ## Event extraction principles

    - Organize information by topic and document hierarchy. State facts in complete
      subject-action-object sentences instead of concatenating source text.
    # [[rich]]
    - One event should have one clear center; its title, summary, and content must agree.
    # [[minimal]]
    - One event should have one clear center; its title and content must agree.
    # [[/]]
    - Content should explain what happened, who was involved, the essential process, and outcome.
    - Preserve material figures and conclusions.
    - You may reorder wording and resolve a pronoun only with sufficient evidence. Never change
      the subject, action type, causal direction, negation, or completion state.
    - Distinguish plans, forecasts, recommendations, possibilities, work in progress, and
      completed facts.
    - Never turn external knowledge, a URL, filename, publishing platform, or model inference
      into a source fact.
    - Children may represent a hierarchy present in the source, with at most two child levels.
      Do not manufacture empty parent events merely to create a hierarchy.

    ## Entity extraction principles

    - Extract only entities needed to understand the event: people, organizations, locations,
      products, tasks, time expressions, and material metrics.
    - Entity types must come from `meta.entity_types`; never invent a type.
    - Split coordinated entities. “Company A and Company B” are two organization entities.
    - Each description must explain the entity's role, action, or relationship in this event,
      rather than repeat its name.
    - Prefer a specific entity type over a generic tag type.
    - Resolve a pronoun only when the current fragments or previous context identify one subject
      unambiguously. Otherwise preserve the original wording.

    ## Boundaries for document context

    - `source_title`, `source_summary`, and `previous_context` may only support topic recognition,
      noise filtering, and disambiguation.
    - Every fact, figure, conclusion, and reference in an event must have direct support in the
      current `items`.
    - Never import facts from the full-document summary into a Chunk that does not state them.
    - If the current fragments cannot support an independently useful event, return empty
      `items`; do not assemble one from contextual metadata.
    - Related historical events help distinguish names but are not evidence for this extraction.

    ## Task

    Execute these steps in order:

    1. **Global scan**
       - Mark subjects, actions, objects, time, place, figures, causes, outcomes, and uncertainty.
       - Identify subject continuity, chronology, causal progression, and summary-detail
         relationships across fragments.
       - Inside `[IMAGE]...[/IMAGE]`, retain factual text and ignore buttons, navigation, and
         layout descriptions.
       - Treat headers, footers, numbering residue, ads, QR instructions, copyright notices,
         publishing metadata, and garbled text as noise.

    2. **Aggregation or split decision**
       - Fixed priority: aggregate summary material > separate detailed expansion after a
         summary > split ordinary material by topic.
       - Abstracts, overviews, executive summaries, key takeaways, conclusions, and explicitly
         labeled summaries form one aggregated event.
       - Detailed expansion after a summary may form a separate event, but must not duplicate
         the whole summary.
       - Split ordinary material only when multiple clearly independent topics each contain
         substantive information.
       - Do not split on wording differences, name changes, or isolated one-line fragments.

    3. **Hierarchy**
       - Use children only when the source clearly has a general-to-specific relationship.
       - A parent captures the shared through-line; children carry independently meaningful detail.
       - Parent and child content must not be duplicate paraphrases.
       - Keep events flat when the source has no meaningful hierarchy.

    4. **Construct events**
       - Titles express the topic and key conclusion; avoid empty labels such as “Overview”.
    # [[rich]]
       - Summaries provide the core fact in one sentence.
    # [[/]]
       - Content is concise and independently readable, covering cause, process, and conclusion
         without reasoning notes or source markers.

    # [[rich]]
    5. **Evidence tracing**
       - Determine the source fragment for every factual statement in content.
       - References contain only current input ids that directly support the event. They must be
         non-empty, unique, and 1-based.
       - A fragment may support several events; never add unrelated references for coverage.
       - Never put `[1]`, “fragment 2”, or similar evidence markers in title, summary, or content.
    # [[minimal]]
    5. **Expression constraints**
       - Never put `[1]`, “fragment 2”, or similar evidence markers in title or content.
    # [[/]]

    6. **Extract entities**
       - Extract entities only from fragments referenced by the event.
       - Preserve official names, numeric units, and source time wording.
       - Keep the same entity consistent and never merge distinct entities merely because names look alike.

    7. **Final self-check**
       - Check for facts absent from current `items`.
       - Check that plans, discussion, and forecasts were not turned into completed facts.
    # [[rich]]
       - Check entity limits and the references contract for every valid event.
    # [[minimal]]
       - Check entity limits for every valid event.
    # [[/]]
       - Check that output contains only fields allowed by the canonical contract.
       - If every fragment is noise or insufficient, return `items: []` and explain why.

    ## Input interpretation

    - `data.items` is the only factual source; each item has a 1-based `id` and `content`.
    - `meta.source_title` is the document title.
    - `meta.source_summary` is an optional extractive full-document summary.
    - `meta.previous_context` is bounded context preceding this Chunk.
    - `meta.related_events` is read-only disambiguation context.
    - `meta.entity_types` is the only allowed entity-type set.

    ## Output requirements

    - Return only the canonical JSON contract, with no Markdown, explanation, or extra fields.
    - Response `data` contains only `items`; do not output other fields.
    - Each event's fields are governed by the output JSON schema contract; provide exactly those fields.
    - When no valid event exists, return an empty array, never `null` or a placeholder event.

    ## Compliance and noise boundaries

    - Publishing time, location, and source metadata unrelated to the body are not events.
    - Exclude clearly unlawful, sexually explicit, hate-inciting, or wholly irrelevant fragments
      rather than amplifying them in events.
    - Compliance filtering must not suppress ordinary lawful reporting, research, or risk analysis.
    - Preserve relative time such as Friday, next week, month-end, or next year unless the source
      itself gives an explicit calendar date.
  examples:
    input: |
      {
        "type": "request",
        "data": {
          "items": [
            {"id": 1, "content": "Acme disclosed that it completed a CNY 200 million Series B round in 2024."},
            {"id": 2, "content": "The proceeds will primarily fund industrial-vision R&D and expansion of the East China delivery team."},
            {"id": 3, "content": "By year-end, the company had deployed three new production lines with a 96% project acceptance rate."},
            {"id": 4, "content": "Footer: follow our account for more updates."}
          ],
          "meta": {
            "source_type": "article",
            "source_title": "Acme 2024 Annual Report",
            "source_summary": "The report covers financing, R&D investment, and production-line delivery.",
            "previous_context": "",
            "related_events": [],
            "entity_types": [
              {"type": "organization", "description": "Company or institution"},
              {"type": "product", "description": "Product or system"},
              {"type": "metric", "description": "Amount, percentage, or count"},
              {"type": "task", "description": "Task or work item"}
            ]
          }
        }
      }
    output: |
      {
        "type": "response",
        "data": {
          "items": [
            {
              "reason": "Item 1 states the financing fact and item 2 explains the use of proceeds; both belong to one financing thread, so they are aggregated into a single event.",
              "title": "Acme completes Series B and funds R&D and delivery",
              "summary": "Acme completed a CNY 200 million Series B round for industrial-vision R&D and East China delivery expansion.",
              "content": "Acme completed a CNY 200 million Series B round in 2024 and plans to use the proceeds primarily for industrial-vision product R&D and expansion of its East China delivery team.",
              "references": [1, 2],
              "entities": [
                {"type": "organization", "name": "Acme", "description": "Company that completed the round and is investing in R&D and delivery"},
                {"type": "product", "name": "industrial-vision product", "description": "Product area funded by the financing"},
                {"type": "metric", "name": "CNY 200 million", "description": "Amount of Acme's Series B financing"}
              ],
              "is_valid": true,
              "children": []
            },
            {
              "reason": "Item 3 describes production-line deployment and acceptance rate, unrelated to the financing thread, so it becomes its own event; item 4 is footer noise and is not extracted.",
              "title": "Acme deploys three new production lines",
              "summary": "Acme deployed three new lines by year-end with a 96% project acceptance rate.",
              "content": "By the end of 2024, Acme had deployed three new production lines, and the related projects reached a 96% acceptance rate.",
              "references": [3],
              "entities": [
                {"type": "organization", "name": "Acme", "description": "Company that completed the new production-line deployments"},
                {"type": "metric", "name": "three", "description": "Number of newly deployed production lines"},
                {"type": "metric", "name": "96%", "description": "Acceptance rate for the related projects"}
              ],
              "is_valid": true,
              "children": []
            }
          ]
        }
      }
