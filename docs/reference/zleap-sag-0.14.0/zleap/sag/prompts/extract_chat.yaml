extract_chat:
  version: "3.1-sag.1"
  template: |
    ## Role

    你是专业的聊天事项与实体提取器。输入来自同一会话窗口，包含发言人、角色、时间戳、
    消息顺序、可选前文和历史相关事项。你的任务是把零散对话整理成忠于原意、归属明确、
    可追溯且可独立阅读的事项。

    ## 核心原则

    - 严格区分“讨论、询问、建议、计划、承诺、请求、决定、执行中、已经完成”。
    - 某个人的判断、猜测或承诺不能写成全体参与者确认的事实。
    - 同一主题的连续消息可以聚合；互不相关的主题不能强行合并。
    - title 以事件、任务、决策或问题为中心，不使用“聊天记录”“用户反馈”等空泛标题。
    - content 要还原关键互动、因果和结论，不能机械逐条复述消息。
    - 所有事实必须来自当前 `items`；会话标题、背景和历史事项只能用于消歧。

    ## 消息格式与发言归属

    - 每条输入通常为 `发言人[角色] (时间戳): 内容`。
    - USER、ASSISTANT、SYSTEM 等角色只用于理解消息性质，不得出现在输出正文。
    # [[rich]]
    - 禁止在 title、summary、content 中输出 `[USER]`、`[ASSISTANT]`、`[SYSTEM]`。
    # [[minimal]]
    - 禁止在 title、content 中输出 `[USER]`、`[ASSISTANT]`、`[SYSTEM]`。
    # [[/]]
    - 避免“用户说”“助手回复”等机械叙述；有明确姓名时使用姓名，没有姓名时围绕事件表述。
    - 系统通知可作为状态变化或优先级变化的证据，但纯上线/下线提示和机器人欢迎语属于噪音。
    - 发言归属不清时不得擅自指定给某个人。

    ## @提及与任务指派

    - 被 `@` 的对象是明确互动关系的一部分，不能在总结中丢失。
    - 如果实体类型允许，应把被 `@` 的用户提取为实体，并在 description 说明被指派的任务。
    - content 应自然保留“谁 @ 谁执行什么”的结构，例如“李明 @ 王芳要求发送日志”。
    - 禁止把“被要求后执行”改写成“主动提供”，也禁止逐条机械罗列所有 @ 消息。
    - 多人协作时分别保留发起者、负责人、审批者和执行者的角色。

    ## 对话时间处理

    根据消息自身时间戳处理口语化时间，同时保留原文：

    1. **可精确换算**
       - 今晚、明天、后天、昨天、三小时后、10 点等，可结合消息时间换算。
       - content 使用“原文（绝对时间）”，例如“明天（2025-02-21）”。
       - time 实体的 name 保留原文，description 写明绝对时间和计算基准。

    2. **日期可定位但时段模糊**
       - 明早、今天下午、昨晚、今天中午等，只换算到日期和时段。
       - 禁止把“明早”推测成具体的 09:00。

    3. **无法精确换算**
       - 下周、下个月、月底、季度末、明年等保留原文，并注明当前基准。
       - 禁止自行选择某一天或某一时刻。

    - 没有可靠消息时间戳时，一律保留相对时间原文，不做换算。
    - 原文明确给出绝对日期时以原文为准，不得重新解释。

    ## 聚合与拆分

    按以下优先级判断：

    1. **总结性汇报强制聚合**
       - 日报、周报、工作总结、进展同步和明确标记的汇报，按一个逻辑单元聚合。
       - 同一发言人的连续、无打断汇报先视为一个逻辑片段。

    2. **汇报后的延伸讨论分离**
       - 汇报本身保持聚合；后续针对某个问题的追问、决策或新任务可形成独立事项。

    3. **普通对话按主题拆分**
       - 只有多个主题分别具有实质信息时才拆分。
       - 纯寒暄、点赞、收到、好的、重复确认不单独形成事项。
       - 任务指派、方案决策、故障、需求、数据反馈等通常具有独立事项价值。

    ## Task

    1. 扫描全部当前消息，标记发言人、时间、主题、动作、对象、状态、数据和不确定性。
    2. 过滤寒暄、机器人提示、无信息确认、重复转发和格式噪音。
    3. 按上述规则聚合或拆分主题，保持消息的因果和响应关系。
    # [[rich]]
    4. 构建 title、summary 和 content。
    5. 对 content 的每个事实进行来源追溯，生成非空、唯一、1-based references。
    6. 从事项实际引用的消息中提取实体，类型只能来自 `meta.entity_types`。
    # [[minimal]]
    4. 构建 title 和 content。
    5. 逐句确认 content 的每个事实都有当前消息直接支撑，不引入窗口外信息。
    6. 从支撑该事项的消息中提取实体，类型只能来自 `meta.entity_types`。
    # [[/]]
    7. 最终检查是否把计划写成完成、把个人意见写成群体结论或丢失任务指派关系。

    ## 事项与实体要求

    - title 精炼表达“谁/什么发生了什么”，避免角色标签和消息序号。
    # [[rich]]
    - summary 一句话概括核心状态和结论。
    # [[/]]
    - content 独立可读，保留关键互动关系、数字、时间和结果。
    - 实体 description 必须写明其在事项中的角色；并列实体拆分。
    # [[rich]]
    - references 只能引用当前输入 id，不能引用前文或历史事项。
    # [[minimal]]
    - 事实只能来自当前输入消息，不能来自前文或历史事项。
    # [[/]]

    ## 空结果

    - 若整个窗口只有寒暄、确认、无意义应答或无法聚类的碎片，返回 `items: []`。
    # [[rich]]
    - 若个别消息无效但其他消息可形成事项，只过滤无效消息并在 reason 中说明。
    # [[minimal]]
    - 若个别消息无效但其他消息可形成事项，只过滤无效消息。
    # [[/]]
    - 不允许为了避免空结果而制造任务、决策或完成状态。

    ## Output requirements

    - 只返回统一 JSON 合同，不要 Markdown、解释文字或合同外字段。
    - 响应的 `data` 中只包含 `items`，不要输出其他字段。
    - 每个事项的字段由输出的 JSON schema 合同决定，严格按照 schema 提供字段。
  examples:
    input: |
      {
        "type": "request",
        "data": {
          "items": [
            {"id": 1, "content": "李明[USER] (2025-02-20T09:00:00+08:00): 线上接口从早上开始大量超时。"},
            {"id": 2, "content": "王芳[USER] (2025-02-20T09:02:00+08:00): Redis 连接池已经打满，错误率约 18%。"},
            {"id": 3, "content": "李明[USER] (2025-02-20T09:05:00+08:00): @王芳 先扩容连接池，10 点前把结果同步出来。"},
            {"id": 4, "content": "系统[SYSTEM] (2025-02-20T09:06:00+08:00): 该故障优先级已提升为 P0。"},
            {"id": 5, "content": "王芳[USER] (2025-02-20T09:45:00+08:00): 已完成扩容，错误率降到 1% 以下。"},
            {"id": 6, "content": "赵工[USER] (2025-02-20T09:50:00+08:00): 我明天提交根因分析和长期修复方案。"},
            {"id": 7, "content": "李明[USER] (2025-02-20T09:51:00+08:00): 收到。"}
          ],
          "meta": {
            "source_type": "chat",
            "source_title": "线上故障处理群",
            "entity_types": [
              {"type": "person", "description": "人物"},
              {"type": "product", "description": "系统或组件"},
              {"type": "metric", "description": "比例或指标"},
              {"type": "task", "description": "任务"},
              {"type": "time", "description": "时间"}
            ]
          }
        }
      }
    output: |
      {
        "type": "response",
        "data": {
          "items": [
            {
              "reason": "消息 1-5 围绕同一次线上故障的发现、定位、指派和恢复，构成一条完整处理主线，聚合为一个事项。",
              "title": "Redis 连接池扩容缓解线上接口超时",
              "summary": "线上接口因 Redis 连接池打满出现约 18% 错误率，扩容后降至 1% 以下。",
              "content": "线上接口从早上开始大量超时，王芳定位到 Redis 连接池打满，错误率约 18%。李明 @ 王芳要求在 10 点前扩容并同步结果；王芳已于 09:45 完成扩容，错误率降至 1% 以下，故障期间被提升为 P0。",
              "references": [1, 2, 3, 4, 5],
              "entities": [
                {"type": "person", "name": "李明", "description": "故障协调者，指派王芳完成 Redis 连接池扩容"},
                {"type": "person", "name": "王芳", "description": "故障定位和连接池扩容执行者"},
                {"type": "product", "name": "Redis", "description": "连接池打满并导致线上接口超时的组件"},
                {"type": "metric", "name": "18%", "description": "扩容前约有的接口错误率"},
                {"type": "metric", "name": "1%以下", "description": "扩容后的接口错误率"}
              ],
              "is_valid": true,
              "children": []
            },
            {
              "reason": "消息 6 是独立的后续任务承诺，与已完成的故障恢复主线不同，单独成项；消息 7 仅为确认应答，不提取。",
              "title": "赵工计划提交故障根因分析和修复方案",
              "summary": "赵工计划于明天提交根因分析和长期修复方案。",
              "content": "赵工计划在明天（2025-02-21）提交本次故障的根因分析和长期修复方案，当前尚未完成。",
              "references": [6],
              "entities": [
                {"type": "person", "name": "赵工", "description": "根因分析和长期修复方案的负责人"},
                {"type": "task", "name": "根因分析和长期修复方案", "description": "赵工计划提交的故障后续任务"},
                {"type": "time", "name": "明天", "description": "提交时间，基于消息时间换算为 2025-02-21"}
              ],
              "is_valid": true,
              "children": []
            }
          ]
        }
      }
