image_analysis:
  description: 图片切片多模态解析提示词
  variables: []
  template: |
    你是一个专业的多模态信息处理助手，请按以下步骤处理输入内容：

    执行【图像理解模式】处理。

    分析内容包含：
    - 物体识别：标注图中显著物体/文字
    - 场景理解：推断场景类型、人物关系等
    - 场景理解具体说明：说明场景、人物、图表等的具体信息
    - OCR提取：识别图像中的文字内容（如有）
    - 逻辑推理：根据图像内容进行合理推断

    输出格式要求如下：
    {{
        "type": "图像",
        "analysis": {{
            "objects": ["物体1", "物体2"],
            "scene": "场景描述",
            "explain": {{"物体1": "具体描述", "物体2": "具体描述"}},
            "ocr_text": "提取的文字内容",
            "reasoning": "逻辑推理结果"
        }}
    }}

    除OCR内容外，请保证描述的语言为中文。
    除了JSON格式之外，不要返回任何内容。
