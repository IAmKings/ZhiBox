distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# ---------------------------------------------------------------------------
# B4-2 Gradle 发行包完整性校验
# 官方 sha256（Gradle 8.14.3 bin 包），来源：
#   https://services.gradle.org/distributions/gradle-8.14.3-bin.zip.sha256
# wrapper 下载后会用此值校验；镜像被篡改/文件损坏会直接失败（不要为绕过而删除）。
# 换版本时必须同步更新该值（sha256 与版本一一对应，不是任意 Gradle 包通用）。
# ---------------------------------------------------------------------------
distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
# ---------------------------------------------------------------------------
# 发行包来源：当前保留国内镜像（本机/CI 可达性优先，P1-7 依赖治理项）。
# 切换官方源方法：把下面的 distributionUrl 替换为
#   distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
# 注意：只有“同版本官方 bin 包”与上面的 sha256 匹配；镜像若重新打包会导致校验失败，
#       此时应改用官方源（而不是删除校验）。
# ---------------------------------------------------------------------------
distributionUrl=https\://mirrors.huaweicloud.com/gradle/gradle-8.14.3-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
