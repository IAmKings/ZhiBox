<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">ZhiBox — Obsidian Core</title>
  <desc id="desc">A refined charcoal cube with a restrained breathing-green node at its three-face intersection and a white geometric Z underneath. Transparent background.</desc>
  <defs>
    <linearGradient id="topPlane" x1="286" y1="179" x2="700" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D403C"/>
      <stop offset="0.36" stop-color="#30332F"/>
      <stop offset="0.77" stop-color="#232623"/>
      <stop offset="1" stop-color="#191B19"/>
    </linearGradient>
    <linearGradient id="leftPlane" x1="192" y1="340" x2="540" y2="847" gradientUnits="userSpaceOnUse">
      <stop stop-color="#282B28"/>
      <stop offset="0.48" stop-color="#1C1E1C"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="rightPlane" x1="570" y1="465" x2="873" y2="785" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202320"/>
      <stop offset="0.38" stop-color="#141715"/>
      <stop offset="1" stop-color="#0D0F0E"/>
    </linearGradient>
    <linearGradient id="facetSheen" x1="492" y1="142" x2="492" y2="493" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftGlint" x1="512" y1="505" x2="308" y2="387" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A0F399" stop-opacity="0.85"/>
      <stop offset="0.24" stop-color="#74BE70" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2E7D32" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rightGlint" x1="512" y1="505" x2="729" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A0F399" stop-opacity="0.9"/>
      <stop offset="0.27" stop-color="#74BE70" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2E7D32" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="centerGlint" x1="512" y1="505" x2="512" y2="645" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A0F399" stop-opacity="0.78"/>
      <stop offset="0.36" stop-color="#2E7D32" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2E7D32" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(512 505) rotate(90) scale(115)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A0F399" stop-opacity="0.30"/>
      <stop offset="0.27" stop-color="#2E7D32" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2E7D32" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node" cx="0" cy="0" r="1" gradientTransform="translate(507 499) rotate(56) scale(28)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.27" stop-color="#D9FFD4"/>
      <stop offset="0.58" stop-color="#A0F399"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </radialGradient>
    <linearGradient id="zWhite" x1="426" y1="649" x2="599" y2="801" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F5F7F3"/>
      <stop offset="1" stop-color="#E7EAE5"/>
    </linearGradient>
    <filter id="ambientBlur" x="350" y="343" width="324" height="324" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="pinGlow" x="452" y="445" width="120" height="120" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="cubeClip">
      <path d="M496 128Q512 119 528 128L835 306Q853 317 853 338V685Q853 706 835 717L530 893Q512 903 494 893L189 717Q171 706 171 685V338Q171 317 189 306L496 128Z"/>
    </clipPath>
  </defs>

  <!-- Quiet architectural silhouette; no enclosing tile or background. -->
  <g clip-path="url(#cubeClip)">
    <path d="M512 118L862 320L512 523L162 320Z" fill="url(#topPlane)"/>
    <path d="M162 320L512 523V914L162 711Z" fill="url(#leftPlane)"/>
    <path d="M862 320L512 523V914L862 711Z" fill="url(#rightPlane)"/>
    <path d="M512 118L854 318L512 508L170 318Z" fill="url(#facetSheen)"/>
    <!-- Single restrained bevel on the outside boundaries. -->
    <path d="M512 129L829 312" stroke="#F5F3EE" stroke-opacity=".19" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M512 129L195 312" stroke="#F5F3EE" stroke-opacity=".11" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M185 335V679" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="2.5"/>
    <path d="M840 335V679" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="2.5"/>
    <!-- Tonal face joints, not all-over neon. -->
    <path d="M171 320L512 516L853 320" stroke="#B8BDB5" stroke-opacity=".14" stroke-width="3"/>
    <path d="M512 516V895" stroke="#A2ADA2" stroke-opacity=".105" stroke-width="3"/>
    <path d="M171 320L512 516" stroke="url(#leftGlint)" stroke-width="4" stroke-linecap="round"/>
    <path d="M853 320L512 516" stroke="url(#rightGlint)" stroke-width="4" stroke-linecap="round"/>
    <path d="M512 516V655" stroke="url(#centerGlint)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="512" cy="516" r="104" fill="url(#ambient)"/>
    <!-- Almost invisible tactile panel gives the central monogram a clean reading area. -->
    <path d="M405 629H619V816H405Z" fill="#121412" opacity="0.12"/>
  </g>

  <!-- Small emerald beacon where the three planes connect. -->
  <circle cx="512" cy="516" r="23" fill="#A0F399" opacity="0.52" filter="url(#pinGlow)"/>
  <circle cx="512" cy="516" r="17" fill="#2E7D32" opacity=".36"/>
  <circle cx="512" cy="516" r="11.5" fill="url(#node)"/>
  <circle cx="507.8" cy="511.3" r="3.2" fill="#FFFFFF" opacity=".84"/>

  <!-- Custom outlined, typographically balanced Z, sized for app launcher legibility. -->
  <path d="M418 646Q418 640 424 640H600Q606 640 606 646V668Q606 672 602 676L481 774H600Q606 774 606 780V800Q606 806 600 806H424Q418 806 418 800V778Q418 774 423 770L544 672H424Q418 672 418 666Z" fill="url(#zWhite)"/>
</svg>
